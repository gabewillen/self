interface:
  display_name: "Agent Router"
  short_description: "Routes split agent roles"
  default_prompt: "Use $gabe to route agent-shaped work with the best available model and effort level for each role and task. Any agent with no parent that is not a subagent is a root orchestrator. Subagents use $gabe-implement only. Keep control records as executable MDScript under ~/.agents/projects/project-name/, directly validate them, and treat MDScripts exactly like documentation for review. Parent processes compose gabe-review and fan out only per-lane blind reviewers."
