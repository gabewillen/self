interface:
  display_name: "Gabe Automate"
  short_description: "Writes automations as MDScript continuations"
  default_prompt: "Use $gabe-automate before calling automation tools so each automation has an exact mdscript-exec re-entry point, role boundary, cadence, stop condition, evidence/reporting contract, and prompt return script for authority. Use gpt-5.6 Sol with medium reasoning for resumed orchestrators and a task-appropriate gpt-5.6-family model and reasoning level for resumed implementers or reviewers. Keep related tasks, comments, plans, goals, durable instructions, handoffs, and continuations as executable MDScript under ~/.agents/projects/project-name/, never in the working repository."
