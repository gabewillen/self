interface:
  display_name: "Gabe Implement"
  short_description: "Gabe implementation worker"
  default_prompt: "Use $gabe-implement with a task-appropriate gpt-5.6-family model and reasoning level to own a delegated implementation lane, record the selection basis, state the scoped DBC claim and proof boundaries, write executable MDScript control records under ~/.agents/projects/project-name/, directly validate them, use recursive $gabe-review when code changed, use one fresh review when no code changed including MDScript and documentation changes, never recurse non-code review after repair, and report to the parent before stopping."
