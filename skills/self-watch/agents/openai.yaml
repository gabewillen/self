interface:
  display_name: "Self Watch"
  short_description: "Persistent interval PR watcher"
  default_prompt: "Use $self-watch with an interval and PR to arm one persistent while-true loop for unresolved review comments, CI/CD failures, and base-branch drift. Select a fast model at low effort for easy fixes and the strongest available model at high effort for hard repairs. Do not re-arm each tick. Stop only on /self-unwatch or when the PR is merged/closed."
