interface:
  display_name: "Self Automate"
  short_description: "Writes automations as MDScript continuations"
  default_prompt: "Use $self-automate before calling automation tools so each automation has an exact mdscript-exec re-entry point, role boundary, cadence, stop condition, evidence/reporting contract, and prompt return script for authority. Use a model and effort level selected for the resumed role and its task. Keep related tasks, comments, plans, goals, durable instructions, handoffs, and continuations as executable MDScript under ~/.agents/projects/project-name/, never in the working repository."
